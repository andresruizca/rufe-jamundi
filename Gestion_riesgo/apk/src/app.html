<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<!--
			`viewport-fit=cover` y `user-scalable=no`: en un teléfono la aplicación
			ocupa la pantalla entera, y el doble toque que hace zoom en una página
			web aquí solo consigue descuadrar el formulario.
		-->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
		/>
		<meta name="theme-color" content="#0d2b4e" />
		<title>Inspección de Vivienda · Jamundí</title>

		<!--
			NADA de tipografías de Google ni de ningún otro sitio.
			La web sí las carga, y ahí tiene sentido. Aquí no: esta aplicación
			existe precisamente para funcionar donde no hay señal, y una hoja de
			estilos remota tarda quince segundos en rendirse y deja el formulario
			dibujado con la letra del sistema a mitad de camino. Se usa la
			tipografía del teléfono desde el primer momento.
		-->
		<style>
			:root {
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
			}
		</style>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
